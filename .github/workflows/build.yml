name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r sidecar/requirements.txt pyinstaller
      - run: python sidecar/build_sidecar.py
      - run: npm ci --prefix app
      - run: .\app\node_modules\.bin\tauri.cmd build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Book-Downloader-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
