name: Checks

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python tests/test_install_mac.py
      - run: python tests/test_start_app.py
      - run: npm ci --prefix app
      - run: npm run build --prefix app

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install_windows.ps1), [ref]$null, [ref]$errors
          )
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
